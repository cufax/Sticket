<script>
  // ===============================================================
    // 6. HANDLERS (Manejadores de Eventos)
    // ===============================================================
    /**
     * @description El objeto 'Handlers' contiene las funciones que se ejecutan en respuesta a eventos del usuario.
     */
    const Handlers = {
        /**
         * 🆕 Maneja la descarga del reporte generado como un archivo PDF.
         */
        async handleDownloadReportPDF() {
            const downloadBtn = document.getElementById('download-pdf-btn');
            UI.toggleButtonSpinner(downloadBtn, true);

            try {
                const { jsPDF } = window.jspdf;
                const dimensionEl = document.querySelector('#report-dimension-drop .report-field-item');
                const metricEl = document.querySelector('#report-metric-drop .report-field-item');

                // Obtener los datos del estado actual para asegurar consistencia
                const reportData = state.lastReportData;

                if (!reportData) {
                    throw new Error("No hay datos de reporte para exportar.");
                }

                const dimensionLabel = dimensionEl.textContent.trim();
                const metricLabel = metricEl.textContent.trim();

                // 1. Renderizar el layout profesional en el contenedor oculto
                const reportContent = UI.renderReportForPDF(reportData, dimensionLabel, metricLabel);

                // 2. Usar html2canvas para capturar el contenido como una imagen
                const canvas = await html2canvas(reportContent, {
                    scale: 2, // Aumentar la resolución para mayor calidad
                    useCORS: true,
                    logging: false
                });

                const imgData = canvas.toDataURL('image/png');

                // 3. Usar jsPDF para crear el PDF e insertar la imagen
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();

                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);

                // 4. Iniciar la descarga
                pdf.save('Reporte_Sticket_Pro.pdf');

            } catch (error) {
                console.error("Error al generar el PDF:", error);
                UI.handleError(new Error("No se pudo generar el PDF. " + error.message));
            } finally {
                UI.toggleButtonSpinner(downloadBtn, false);
                // Limpiar el render target
                document.getElementById('pdf-render-target').innerHTML = '';
            }
        },

        /**
         * Maneja la solicitud de generar un reporte personalizado.
         * ✅ CORREGIDO: Ahora guarda los datos en el estado del frontend.
         */
        handleGenerateReport() {
            const dimensionEl = document.querySelector('#report-dimension-drop .report-field-item');
            const metricEl = document.querySelector('#report-metric-drop .report-field-item');
            if (!dimensionEl || !metricEl) {
                Swal.fire('Configuración Incompleta', 'Debes arrastrar un campo a "Dimensión" y otro a "Métrica".', 'warning');
                return;
            }
            const reportConfig = {
                dimension: dimensionEl.dataset.fieldId,
                metric: metricEl.dataset.fieldId,
                chartType: document.getElementById('report-chart-type').value,
                startDate: document.getElementById('report-start-date').value,
                endDate: document.getElementById('report-end-date').value
            };
            LoadingManager.show();
            API.runServerFunction('generateCustomReport', reportConfig,
                response => {
                    LoadingManager.hide();
                    if (response.status === 'success') {
                        // ----> ESTA ES LA LÍNEA CRÍTICA QUE SE AÑADE <----
                        state.lastReportData = response.data; 
                        
                        UI.renderCustomReport(response.data, reportConfig.chartType);
                    } else {
                        UI.handleError(new Error(response.message || 'Error al generar el reporte.'));
                    }
                },
                error => {
                    LoadingManager.hide();
                    UI.handleError(error);
                }
            );
        },

        /**
        * 🆕 Maneja el cambio en el switch "Mis Tickets".
        * @param {Event} event - El objeto del evento de cambio.
        */
        handleMyTicketsFilterChange(event) {
            state.isMyTicketsFilterActive = event.target.checked;
            state.pagination.currentPage = 1; // Resetear paginación al cambiar el filtro
            App.refreshData(); // Recargar datos con el nuevo filtro
        },

        // IAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        handleBotQuery() {
            const input = document.getElementById('chat-input');
            const query = input.value.trim();
            if (!query) return;

            UI.addChatMessage('user', query);
            input.value = '';
            input.disabled = true;
            document.getElementById('chat-send-btn').disabled = true;
            UI.showBotTyping(true);

            const onSuccess = (response) => {
                UI.showBotTyping(false);
                UI.addChatMessage('bot', response);
                input.disabled = false;
                document.getElementById('chat-send-btn').disabled = false;
                input.focus();
            };

            const onFailure = (error) => {
                UI.showBotTyping(false);
                UI.addChatMessage('error', `Error: ${error.message}`);
                input.disabled = false;
                document.getElementById('chat-send-btn').disabled = false;
                input.focus();
            };

            API.runServerFunction('getBotResponse', query, onSuccess, onFailure);
        },
        // TERMINA    IAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        /**
         * 🆕 Maneja el guardado de la fecha de resolución real.
         * @param {string} ticketId - El ID del ticket.
         */
        handleRealResolutionDateSave(ticketId) {
            const dateInput = document.getElementById('detalle-fecha-resolucion-real');
            if (!dateInput.value) {
                Swal.fire('Atención', 'Por favor, seleccione una fecha.', 'warning');
                return;
            }

            const params = {
                ticketId: ticketId,
                resolutionDate: dateInput.value
            };

            const button = document.getElementById('save-fecha-resolucion-real-btn');
            UI.toggleButtonSpinner(button, true);

            API.runServerFunction('updateRealResolutionDate', params,
                response => {
                    UI.toggleButtonSpinner(button, false);
                    if (response.status === 'success') {
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 2000,
                            timerProgressBar: true,
                            icon: 'success',
                            title: response.message
                        });

                        // ✅ NUEVO: Recargar datos y actualizar el modal inmediatamente
                        App.refreshData();

                        // Actualizar el ticket en el estado local y re-renderizar el modal
                        setTimeout(() => {
                            const updatedTicket = state.allTicketsForStats.find(t => t.ticketInterno === ticketId);
                            if (updatedTicket) {
                                // Asegurar que la fecha se parsee correctamente
                                if (typeof updatedTicket.fechaResolucionReal === 'string') {
                                    updatedTicket.fechaResolucionReal = new Date(updatedTicket.fechaResolucionReal);
                                }
                                UI.renderTicketDetailModal(updatedTicket);
                            }
                        }, 1000);

                    } else {
                        UI.handleError(new Error(response.message || 'Error al guardar la fecha.'));
                    }
                },
                error => {
                    UI.toggleButtonSpinner(button, false);
                    UI.handleError(error);
                }
            );
        },


        /**
         * 🆕 Maneja la actualización de las métricas de auditoría desde el modal de detalle.
         * @param {string} ticketId - El ID del ticket.
         */
        handleAuditMetricsSave(ticketId) {
            const malDerivado = document.getElementById('detalle-mal-derivado-check').checked;
            const primerContacto = document.getElementById('detalle-primer-contacto-check').checked;
            const seguimientoEspecial = document.getElementById('detalle-seguimiento-especial-check').checked;
            const detalleSeguimiento = document.getElementById('detalle-seguimiento-especial-input').value;

            const auditParams = {
                ticketId,
                malDerivado,
                primerContacto,
                seguimientoEspecial,
                detalleSeguimiento: seguimientoEspecial ? detalleSeguimiento : ''
            };

            const button = document.getElementById('save-audit-metrics-btn');
            UI.toggleButtonSpinner(button, true);

            API.runServerFunction('updateTicketAuditMetrics', auditParams,
                response => {
                    UI.toggleButtonSpinner(button, false);
                    if (response.status === 'success') {
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 2000,
                            timerProgressBar: true,
                            icon: 'success',
                            title: 'Métricas de auditoría guardadas.'
                        });
                        App.refreshData(); // Recargar datos para reflejar los cambios
                    } else {
                        UI.handleError(new Error(response.message || 'Error al guardar las métricas.'));
                    }
                },
                error => {
                    UI.toggleButtonSpinner(button, false);
                    UI.handleError(error);
                }
            );
        },


        /**
         * @description Maneja los clics en la barra de navegación lateral (sidebar).
         * @param {Event} event - El objeto del evento de clic.
         */
        handleNavigation(event) {
            console.log('🖱️ Click en navegación');
            const navLink = event.target.closest('.nav-link');

            if (navLink && navLink.dataset.view) {
                event.preventDefault();
                console.log('📍 Navegando a:', navLink.dataset.view);
                Router.showView(navLink.dataset.view);
            }
        },

        /**
         * @description Filtra los tickets en tiempo real mientras el usuario escribe en la barra de búsqueda.
         * @param {Event} event - El objeto del evento de input.
         */
        handleSearch(event) {
            state.filters.searchQuery = event.target.value;
            state.pagination.currentPage = 1;
            App.refreshData();

            const modalAuditoria = document.getElementById('modalMetricasUsuario');
            if (modalAuditoria && modalAuditoria.classList.contains('show')) {
                UI.renderUserMetricsModal();
            }
        },

        /**
         * @description Maneja los cambios en los filtros avanzados de tickets.
         * @param {Event}  event - El objeto del evento de cambio.
         */
        handleFilterChange() {
            state.filters.status = document.getElementById('tickets-filter-status')?.value || '';
            state.filters.tool = document.getElementById('tickets-filter-tool')?.value || '';
            state.filters.motivoEscalamiento = document.getElementById('tickets-filter-motivoEscalamiento')?.value || ''; // 🆕 RENOMBRADO
            state.filters.createdBy = document.getElementById('tickets-filter-createdBy')?.value || '';
            state.filters.equipo = document.getElementById('tickets-filter-equipo')?.value || ''; // 🆕 NUEVO
            state.filters.startDate = document.getElementById('tickets-filter-startDate')?.value || '';
            state.filters.endDate = document.getElementById('tickets-filter-endDate')?.value || '';
            state.filters.priority = document.getElementById('tickets-filter-priority')?.value || '';
            state.pagination.currentPage = 1;
            App.refreshData();
        },

        /**
         * @description Limpia todos los filtros avanzados de tickets.
         */
        handleClearFilters() {
            document.getElementById('tickets-filter-status').value = '';
            document.getElementById('tickets-filter-tool').value = '';
            document.getElementById('tickets-filter-motivoEscalamiento').value = ''; // 🆕 RENOMBRADO
            document.getElementById('tickets-filter-createdBy').value = '';
            document.getElementById('tickets-filter-equipo').value = ''; // 🆕 NUEVO
            document.getElementById('tickets-filter-startDate').value = '';
            document.getElementById('tickets-filter-endDate').value = '';
            document.getElementById('tickets-filter-priority').value = '';
            state.filters = {
                searchQuery: state.filters.searchQuery,
                status: '', tool: '', motivoEscalamiento: '', createdBy: '', equipo: '', startDate: '', endDate: '', priority: '' // 🆕 RENOMBRADO
            };
            state.pagination.currentPage = 1;
            App.refreshData();
        },

        /**
         * @description Maneja los clics en los controles de paginación.
         * @param {Event} event - El objeto del evento de clic.
         */
        handlePaginationClick(event) {
            event.preventDefault();
            const target = event.target.closest('.page-link');
            if (!target) return;

            const pageAction = target.dataset.page;
            let newPage = state.pagination.currentPage;

            if (pageAction === 'prev') {
                newPage = Math.max(1, newPage - 1);
            } else if (pageAction === 'next') {
                newPage = Math.min(state.pagination.totalPages, newPage + 1);
            } else {
                newPage = parseInt(pageAction);
            }

            if (newPage !== state.pagination.currentPage) {
                state.pagination.currentPage = newPage;
                App.refreshData();
            }
        },

        /**
         * @description Maneja el envío del formulario de creación de un nuevo ticket.
         * @param {Event} event - El objeto del evento de submit.
         */
        handleTicketSubmit(event) {
            event.preventDefault();
            const form = event.target;

            // 🆕 VALIDACIÓN MEJORADA DE INPUTS DEL FORMULARIO
            let isValid = true;
            const requiredFields = [
                'usuario', 'casoYoizen', 'herramienta', 'planilla', 'motivoEscalamiento', 'idDerivacion'
            ];

            requiredFields.forEach(fieldId => {
                const input = form.elements[fieldId];
                if (input && input.value.trim() === '') {
                    input.classList.add('is-invalid');
                    isValid = false;
                } else {
                    input.classList.remove('is-invalid');
                }
            });

            if (!isValid) {
                UI.showAlert('alertPlaceholderTicket', 'Por favor, completa todos los campos obligatorios.', 'danger');
                return;
            }

            Swal.fire({
                title: '¿Estás seguro?',
                text: "El ticket será enviado para su procesamiento.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Sí, ¡enviar!',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    const button = document.getElementById('submitTicketButton');
                    UI.toggleButtonSpinner(button, true);

                    const onSuccess = (response) => {
                        UI.toggleButtonSpinner(button, false);
                        if (response.status === 'success') {
                            Swal.fire('¡Enviado!', `El ticket #${response.ticket} ha sido creado.`, 'success');
                            bootstrap.Modal.getInstance(document.getElementById('modalNuevoTicket')).hide();
                            form.reset();
                            form.classList.remove('was-validated'); // Asegurar que se quita la validación visual
                            // Limpiar clases de validación manuales
                            requiredFields.forEach(fieldId => {
                                const input = form.elements[fieldId];
                                if (input) input.classList.remove('is-invalid');
                            });
                            App.refreshData();
                            App.fetchNotifications();
                        } else {
                            UI.showAlert('alertPlaceholderTicket', response.message || 'Ocurrió un error desconocido.', 'danger');
                        }
                    };

                    const onFailure = (error) => {
                        UI.toggleButtonSpinner(button, false);
                        UI.handleError(error);
                        UI.showAlert('alertPlaceholderTicket', error.message, 'danger');
                    };

                    const formData = {
                        usuario: form.elements['usuario'].value,
                        casoYoizen: form.elements['casoYoizen'].value,
                        herramienta: form.elements['herramienta'].value,
                        planilla: form.elements['planilla'].value,
                        motivoEscalamiento: form.elements['motivoEscalamiento'].value,
                        idDerivacion: form.elements['idDerivacion'].value,
                        numeroTicket: form.elements['numeroTicket'].value
                    };

                    const fileInput = document.getElementById('capturaFile');
                    const file = fileInput.files[0];

                    const runCreateTicket = (submissionData) => {
                        API.runServerFunction('createTicket', submissionData, onSuccess, onFailure);
                    };

                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const fileData = {
                                fileName: file.name,
                                fileType: file.type,
                                fileContent: e.target.result
                            };
                            runCreateTicket({ ...formData, ...fileData });
                        };
                        reader.readAsDataURL(file);
                    } else {
                        runCreateTicket(formData);
                    }
                }
            });
        },

        /**
         * Maneja el envío del formulario de solicitud de GBs.
         * @param {Event} event - El evento de submit del formulario.
         */
        handleGbRequestSubmit(event) {
            event.preventDefault();
            const form = event.target;

            let isValid = true;
            const requiredFields = ['usuario', 'idGestion', 'numeroContrato', 'numeroLinea', 'motivo'];

            requiredFields.forEach(fieldId => {
                const input = form.elements[fieldId];
                if (input && input.value.trim() === '') {
                    input.classList.add('is-invalid');
                    isValid = false;
                } else {
                    input.classList.remove('is-invalid');
                }
            });

            const smsInputs = form.querySelectorAll('input[name="smsBackup"]');
            if (![...smsInputs].some(r => r.checked)) {
                smsInputs.forEach(r => r.classList.add('is-invalid'));
                isValid = false;
            } else {
                smsInputs.forEach(r => r.classList.remove('is-invalid'));
            }

            if (!isValid) {
                UI.showAlert('alertPlaceholderGb', 'Por favor, completa todos los campos obligatorios.', 'danger');
                return;
            }

            Swal.fire({
                title: '¿Estás seguro?',
                text: 'La solicitud será enviada para su procesamiento.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Sí, ¡enviar!',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    const button = document.getElementById('submitGbButton');
                    UI.toggleButtonSpinner(button, true);

                    const onSuccess = (response) => {
                        UI.toggleButtonSpinner(button, false);
                        if (response.status === 'success') {
                            Swal.fire('¡Enviado!', 'La solicitud ha sido registrada.', 'success');
                            bootstrap.Modal.getInstance(document.getElementById('modalSolicitarGbs')).hide();
                            form.reset();
                            form.classList.remove('was-validated');
                        } else {
                            UI.showAlert('alertPlaceholderGb', response.message || 'Ocurrió un error desconocido.', 'danger');
                        }
                    };

                    const onFailure = (error) => {
                        UI.toggleButtonSpinner(button, false);
                        UI.handleError(error);
                        UI.showAlert('alertPlaceholderGb', error.message, 'danger');
                    };

                    const formData = {
                        usuario: form.elements['usuario'].value,
                        idGestion: form.elements['idGestion'].value,
                        numeroContrato: form.elements['numeroContrato'].value,
                        numeroLinea: form.elements['numeroLinea'].value,
                        smsBackup: form.elements['smsBackup'].value,
                        motivo: form.elements['motivo'].value
                    };

                    API.runServerFunction('submitGbRequest', formData, onSuccess, onFailure);
                }
            });
        },

        /**
         * Maneja el cambio en la casilla de revisión de solicitudes de GBs.
         */
        handleGbAuditCheckboxChange(event) {
            const checkbox = event.target;
            const row = parseInt(checkbox.dataset.row, 10);
            const revisado = checkbox.checked;
            API.runServerFunction('updateGbRequestAuditStatus', { rowNumber: row, revisado }, response => {
                if (response.status !== 'success') {
                    UI.handleError(new Error(response.message || 'Error al actualizar.'));
                    checkbox.checked = !revisado;
                }
            }, error => {
                UI.handleError(error);
                checkbox.checked = !revisado;
            });
        },

        /**
         * @description Maneja la actualización de observaciones de un ticket.
         * @param {string} ticketId - El ID del ticket.
         * @param {string} newObservations - Las nuevas observaciones.
         */
        handleTicketObservationsUpdate(ticketId, newObservations) {
            API.runServerFunction('updateTicketStatus', { ticketId: ticketId, newObservations: newObservations },
                response => {
                    if (response.status === 'success') {
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 2000,
                            timerProgressBar: true,
                            icon: 'success',
                            title: `Observaciones del Ticket ${ticketId} actualizadas`
                        });
                        App.refreshData();
                    } else if (response.status === 'info') {
                        // No hacer nada si no hubo cambios
                    } else {
                        UI.handleError(new Error(response.message || 'Error al actualizar observaciones.'));
                    }
                },
                UI.handleError
            );
        },


        /**
         * 🆕 Maneja la actualización del estado de un ticket desde el modal de detalle.
         * @param {string} ticketId - El ID del ticket.
         * @param {string} newStatus - El nuevo estado.
         */
        handleTicketStatusUpdate(ticketId, newStatus) {
            API.runServerFunction('updateTicketStatus', { ticketId: ticketId, newStatus: newStatus },
                response => {
                    if (response.status === 'success') {
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 2000,
                            timerProgressBar: true,
                            icon: 'success',
                            title: `Estado del Ticket ${ticketId} actualizado a ${newStatus}`
                        });
                        App.refreshData(); // Recargar para que se actualice la vista
                        // Re-renderizar el modal si está abierto
                        const modal = document.getElementById('modalDetalleTicket');
                        if (modal && modal.classList.contains('show')) {
                            const updatedTicket = state.allTicketsForStats.find(t => t.ticketInterno === ticketId);
                            if (updatedTicket) {
                                UI.renderTicketDetailModal(updatedTicket);
                            }
                        }
                    } else if (response.status === 'info') {
                        // No hacer nada si no hubo cambios
                    } else {
                        UI.handleError(new Error(response.message || 'Error al actualizar el estado.'));
                    }
                },
                UI.handleError
            );
        },

        /**
         * 🆕 Maneja la actualización de la prioridad de un ticket.
         * @param {string} ticketId - El ID del ticket.
         * @param {string} newPriority - La nueva prioridad.
         */
        handleTicketPriorityUpdate(ticketId, newPriority) {
            API.runServerFunction('updateTicketStatus', { ticketId: ticketId, newPriority: newPriority },
                response => {
                    if (response.status === 'success') {
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 2000,
                            timerProgressBar: true,
                            icon: 'success',
                            title: `Prioridad del Ticket ${ticketId} actualizada a ${newPriority}`
                        });
                        App.refreshData();
                    } else if (response.status === 'info') {
                        // No hacer nada si no hubo cambios
                    } else {
                        UI.handleError(new Error(response.message || 'Error al actualizar prioridad.'));
                    }
                },
                UI.handleError
            );
        },

        /**
         * 🆕 Maneja la acción de "Tomar Ticket" por un auditor/superuser.
         */
        handleTakeTicket() {
            const ticketId = document.getElementById('detalle-ticket-id').textContent.replace('#', '');
            if (!ticketId) {
                UI.showAlert('alertPlaceholderComments', 'No se pudo obtener el ID del ticket.', 'danger');
                return;
            }

            Swal.fire({
                title: '¿Tomar este ticket?',
                text: `Se registrará que has tomado el ticket ${ticketId} para auditoría.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33',
                confirmButtonText: 'Sí, tomarlo',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    const button = document.getElementById('take-ticket-btn');
                    UI.toggleButtonSpinner(button, true);

                    API.runServerFunction('takeTicket', { ticketId: ticketId },
                        response => {
                            UI.toggleButtonSpinner(button, false);
                            if (response.status === 'success') {
                                Swal.fire({
                                    toast: true,
                                    position: 'top-end',
                                    showConfirmButton: false,
                                    timer: 2000,
                                    timerProgressBar: true,
                                    icon: 'success',
                                    title: response.message
                                });
                                // Actualizar el modal de detalle y los datos globales
                                App.refreshData();
                                // Buscar el ticket actualizado en el estado y re-renderizar el modal
                                const updatedTicket = state.allTicketsForStats.find(t => t.ticketInterno === ticketId);
                                if (updatedTicket) {
                                    UI.renderTicketDetailModal(updatedTicket);
                                }
                            } else {
                                UI.handleError(new Error(response.message || 'Error al tomar el ticket.'));
                            }
                        },
                        error => {
                            UI.toggleButtonSpinner(button, false);
                            UI.handleError(error);
                        }
                    );
                }
            });
        },

        /**
         * 🆕 Maneja el cambio o blur en el campo "Motivo de Escalamiento" para buscar la planilla.
         * @param {Event} event - El objeto del evento.
         */
        handleMotivoEscalamientoChange(event) {
            const motivoInput = event.target;
            const motivo = motivoInput.value.trim();
            const planillaInput = document.getElementById('planilla');
            const rutaOperativaInput = document.getElementById('rutaOperativa'); // NUEVO: Obtener el campo de ruta operativa

            if (motivo) {
                // Buscar Planilla Operativa
                API.runServerFunction('getPlanillaOperativaByMotivo', motivo,
                    response => {
                        if (response) {
                            planillaInput.value = response;
                        } else {
                            planillaInput.value = '';
                        }
                    },
                    error => {
                        console.error('Error al buscar planilla operativa:', error);
                        UI.handleError(error);
                        planillaInput.value = '';
                    }
                );

                // NUEVO: Buscar Ruta Operativa
                API.runServerFunction('getRutaOperativaByMotivo', motivo,
                    response => {
                        if (response) {
                            rutaOperativaInput.value = response;
                        } else {
                            rutaOperativaInput.value = 'No se encontró una ruta operativa asociada a este motivo.';
                        }
                    },
                    error => {
                        console.error('Error al buscar ruta operativa:', error);
                        UI.handleError(error);
                        rutaOperativaInput.value = 'Error al buscar la ruta operativa.';
                    }
                );

            } else {
                planillaInput.value = ''; // Limpiar si el motivo está vacío
                rutaOperativaInput.value = ''; // NUEVO: Limpiar si el motivo está vacío
            }
        },

        /**
         * @description Maneja el envío de un nuevo comentario para un ticket.
         * @param {string} ticketId - El ID del ticket al que se añade el comentario.
         */
        handleCommentSubmit(ticketId) {
            const commentInput = document.getElementById('new-comment-text');
            const commentText = commentInput.value.trim();

            if (!commentText) {
                UI.showAlert('alertPlaceholderComments', 'El comentario no puede estar vacío.', 'warning');
                return;
            }

            const submitButton = document.getElementById('submitCommentButton');
            UI.toggleButtonSpinner(submitButton, true);

            const commentData = {
                ticketId: ticketId,
                commentText: commentText
            };

            API.runServerFunction('addTicketComment', commentData,
                response => {
                    UI.toggleButtonSpinner(submitButton, false);

                    if (response.status === 'success') {
                        commentInput.value = '';

                        if (Swal.isVisible()) {
                            Swal.close();
                        }

                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            showConfirmButton: false,
                            timer: 2000,
                            timerProgressBar: true,
                            icon: 'success',
                            title: 'Comentario añadido',
                            backdrop: false,
                            allowOutsideClick: true,
                            allowEscapeKey: true
                        });

                        const commentsContainer = document.getElementById('ticket-comments-list');
                        commentsContainer.innerHTML = '<div class="text-center text-muted fst-italic">Cargando comentarios...</div>';

                        API.runServerFunction('getTicketComments', ticketId,
                            commentResponse => {
                                if (commentResponse.status === 'ok') {
                                    state.comments[ticketId] = commentResponse.comments;
                                    if (commentResponse.comments.length === 0) {
                                        commentsContainer.innerHTML = '<div class="text-center text-muted fst-italic">No hay comentarios aún.</div>';
                                    } else {
                                        commentsContainer.innerHTML = commentResponse.comments.map(c => `
                                            <div class="comment-item mb-2 p-2 border rounded">
                                                <small class="text-muted">${c.autor} - ${new Date(c.timestamp).toLocaleString()}</small>
                                                <p class="mb-0">${c.comentario}</p>
                                            </div>
                                        `).join('');
                                    }
                                } else {
                                    commentsContainer.innerHTML = `<div class="alert alert-danger">Error al cargar comentarios: ${commentResponse.message}</div>`;
                                }
                            },
                            error => {
                                commentsContainer.innerHTML = `<div class="alert alert-danger">Error del servidor: ${error.message}</div>`;
                            }
                        );

                    } else {
                        UI.showAlert('alertPlaceholderComments', response.message || 'Error al añadir comentario.', 'danger');
                    }
                },
                error => {
                    UI.toggleButtonSpinner(submitButton, false);
                    UI.handleError(error);
                    UI.showAlert('alertPlaceholderComments', error.message, 'danger');
                }
            );
        },

        /**
         * @description Se ejecuta cuando se abre cualquier modal para limpiar su estado previo.
         * @param {Event} event - El evento 'show.bs.modal' de Bootstrap.
         */
        handleModalOpen(event) {
            const form = event.target.querySelector('form');
            if (form) {
                form.classList.remove('was-validated');
                form.reset();
                // Limpiar clases de validación manuales
                form.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
            }

            const placeholder = event.target.querySelector('[id^="alertPlaceholder"]');
            if (placeholder) {
                placeholder.innerHTML = '';
            }
            if (event.target.id === 'modalMetricasUsuario') {
                UI.renderUserMetricsModal(true); // true para indicar que es el modal
            }
        },

        /**
         * @description Captura imágenes pegadas en el modal de nuevo ticket y las asigna al input de adjunto.
         * @param {ClipboardEvent} event - El evento de pegado.
         */
        handlePasteAttachment(event) {
            const modal = document.getElementById('modalNuevoTicket');
            if (!modal || !modal.classList.contains('show')) return;

            const items = event.clipboardData?.items;
            if (!items) return;

            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    if (file) {
                        const fileInput = document.getElementById('capturaFile');
                        if (fileInput) {
                            const dataTransfer = new DataTransfer();
                            dataTransfer.items.add(file);
                            fileInput.files = dataTransfer.files;
                            fileInput.dispatchEvent(new Event('change'));
                        }
                    }
                    event.preventDefault();
                    break;
                }
            }
        },

        /**
         * @description Captura imágenes pegadas en el modal de nuevo ticket y las asigna al input de adjunto.
         * @param {ClipboardEvent} event - El evento de pegado.
         */
        handlePasteAttachment(event) {
            const modal = document.getElementById('modalNuevoTicket');
            if (!modal || !modal.classList.contains('show')) return;

            const items = event.clipboardData?.items;
            if (!items) return;

            for (const item of items) {
                if (item.type.startsWith('image/')) {
                    const file = item.getAsFile();
                    if (file) {
                        const fileInput = document.getElementById('capturaFile');
                        if (fileInput) {
                            const dataTransfer = new DataTransfer();
                            dataTransfer.items.add(file);
                            fileInput.files = dataTransfer.files;
                            fileInput.dispatchEvent(new Event('change'));
                        }
                    }
                    event.preventDefault();
                    break;
                }
            }
        },

        /**
         * @description Maneja el clic en una fila de la tabla de tickets para mostrar sus detalles.
         * @param {string} ticketId - El ID del ticket en la fila clickeada.
         */
        handleTicketRowClick(ticketId) {
            const ticket = state.tickets.find(t => t.ticketInterno === ticketId) ||
                state.allTicketsForStats.find(t => t.ticketInterno === ticketId);
            if (ticket) {
                UI.renderTicketDetailModal(ticket);
                const modal = new bootstrap.Modal(document.getElementById('modalDetalleTicket'));
                modal.show();
            }
        },

        /**
         * @description Maneja la solicitud de exportar los tickets a un archivo Excel.
         * ✅ CORREGIDO
         */
        handleExport() {
            if (state.userProfile.role !== 'SUPERUSER' && state.userProfile.role !== 'AUDITOR') {
                Swal.fire({
                    title: 'Acceso Denegado',
                    text: 'No tienes permisos para exportar datos. Esta funcionalidad está restringida a Auditores y Superusuarios.',
                    icon: 'error',
                    confirmButtonText: 'Entendido'
                });
                return;
            }

            const exportModal = new bootstrap.Modal(document.getElementById('modalExportTickets'));
            const columnsSelect = document.getElementById('export-columns');
            columnsSelect.innerHTML = '';
            const availableColumns = App.getAvailableColumnsForExport();

            availableColumns.forEach(column => {
                const option = document.createElement('option');
                option.value = column.key;
                option.textContent = column.label;
                option.selected = column.defaultSelected;
                columnsSelect.appendChild(option);
            });

            exportModal.show();

            document.getElementById('export-excel-btn').onclick = () => {
                const selectedColumns = Array.from(columnsSelect.selectedOptions).map(option => option.value);
                const startDate = document.getElementById('export-start-date').value;
                const endDate = document.getElementById('export-end-date').value;

                if (selectedColumns.length === 0) {
                    Swal.fire('Error', 'Debes seleccionar al menos una columna para exportar.', 'warning');
                    return;
                }

                Swal.fire({
                    title: 'Exportando tickets...',
                    text: 'Esto puede tardar unos segundos.',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                        const exportParams = {
                            columns: selectedColumns,
                            startDate: startDate,
                            endDate: endDate
                        };
                        API.runServerFunction('exportTicketsToExcel', exportParams,
                            response => {
                                Swal.close();
                                exportModal.hide();
                                if (response.status === 'success' && response.fileUrl) {
                                    Swal.fire({
                                        title: '¡Exportación Exitosa!',
                                        html: `El archivo Excel ha sido generado. <br><a href="${response.fileUrl}" target="_blank" class="btn btn-success mt-3">Descargar Archivo</a>`,
                                        icon: 'success',
                                        showCancelButton: true,
                                        showConfirmButton: false,
                                        cancelButtonText: 'Cerrar'
                                    });
                                } else {
                                    Swal.fire('Error', response.message || 'No se pudo exportar el archivo.', 'error');
                                }
                            },
                            error => {
                                Swal.close();
                                exportModal.hide();
                                UI.handleError(error);
                                Swal.fire('Error', error.message || 'Ocurrió un error al exportar.', 'error');
                            }
                        );
                    }
                });
            };
        },

        /**
         * @description Maneja el envío de una solicitud de GBs y refresca el historial al completar.
         * @param {object} formData - Datos de la solicitud de GB.
         */
        handleGbRequestSubmit(formData) {
            const submitBtn = document.getElementById('gb-request-submit-btn');
            UI.toggleButtonSpinner(submitBtn, true);

            API.runServerFunction('submitGbRequest', formData,
                response => {
                    UI.toggleButtonSpinner(submitBtn, false);

                    if (response && response.status === 'success') {
                        // Disparar evento para que otras partes puedan reaccionar
                        document.dispatchEvent(new CustomEvent('gbRequestSubmitted'));
                        // Re-renderizar el historial inmediatamente
                        UI.renderGbRequestsHistory();
                    } else {
                        UI.showAlert('gb-request-alert', response?.message || 'Error al registrar la solicitud.', 'danger');
                    }
                },
                error => {
                    UI.toggleButtonSpinner(submitBtn, false);
                    UI.handleError(error);
                }
            );
        },

        /**
         * @description Maneja el clic en una notificación para marcarla como leída.
         * @param {Event} event - El objeto del evento de clic.
         */
        handleNotificationClick(event) {
            const notificationItem = event.target.closest('.notification-item-dashboard');

            if (notificationItem) {
                event.preventDefault();
                event.stopPropagation();

                const row = parseInt(notificationItem.dataset.notificationRow);
                const ticketId = notificationItem.dataset.ticketId;

                console.log(`🔔 Clic en notificación - Row: ${row}, TicketId: "${ticketId}"`);

                API.runServerFunction('markNotificationAsRead', row,
                    response => {
                        if (response.status === 'success') {
                            console.log('✅ Notificación marcada como leída');
                            App.fetchNotifications();

                            if (ticketId && ticketId.trim() !== '') {
                                console.log(`🎯 Filtrando por ticket: "${ticketId}"`);

                                Router.showView('tickets');

                                const searchInput = document.getElementById('search-input');
                                if (searchInput) {
                                    searchInput.value = ticketId;
                                }

                                state.filters.searchQuery = ticketId;
                                state.pagination.currentPage = 1;

                                Swal.fire({
                                    title: 'Buscando ticket...',
                                    text: `Filtrando por ticket ${ticketId}`,
                                    allowOutsideClick: false,
                                    showConfirmButton: false,
                                    didOpen: () => {
                                        Swal.showLoading();
                                    }
                                });

                                App.refreshData({
                                    searchQuery: ticketId,
                                    page: 1,
                                    pageSize: 10
                                });

                                setTimeout(() => {
                                    Swal.close();

                                    const foundTicket = state.tickets.find(t => t.ticketInterno === ticketId) ||
                                        (state.allTicketsForStats && state.allTicketsForStats.find(t => t.ticketInterno === ticketId));

                                    if (foundTicket) {
                                        console.log('✅ Ticket encontrado después del filtro, abriendo modal');

                                        setTimeout(() => {
                                            UI.renderTicketDetailModal(foundTicket);
                                            const modal = new bootstrap.Modal(document.getElementById('modalDetalleTicket'));
                                            modal.show();
                                        }, 300);

                                    } else {
                                        console.log('⚠️ Ticket no encontrado después del filtro');
                                        Swal.fire({
                                            title: 'Ticket filtrado',
                                            text: `Se aplicó el filtro para el ticket ${ticketId}. Revisa la tabla de tickets.`,
                                            icon: 'info',
                                            confirmButtonText: 'Entendido'
                                        });
                                    }
                                }, 1500);

                            } else {
                                console.log('ℹ️ Notificación sin ticket asociado');
                                Swal.fire({
                                    title: 'Notificación',
                                    text: 'Esta notificación no tiene un ticket asociado.',
                                    icon: 'info',
                                    confirmButtonText: 'Entendido'
                                });
                            }
                        } else {
                            UI.handleError(new Error(response.message || 'Error al marcar notificación como leída.'));
                        }
                    },
                    error => {
                        console.error('❌ Error al marcar notificación:', error);
                        UI.handleError(error);
                    }
                );
            } else {
                console.log('❌ No se encontró elemento de notificación clickeado');
                console.log('🔍 Elemento clickeado:', event.target);
            }
        }
    };

</script>
