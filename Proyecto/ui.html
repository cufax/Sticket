<script>
    // ===============================================================
    // 5. UI (Manipulación del DOM)
    // ===============================================================

    /**
     * @description El objeto 'UI' agrupa todas las funciones responsables de manipular el DOM.
     */
    const UI = {
        /**
         * 🆕 Renderiza el layout profesional del reporte en un contenedor oculto para la exportación a PDF.
         * @param {object} reportData - Los datos del reporte (labels, data).
         * @param {string} dimensionLabel - El nombre de la dimensión (ej. "Estado").
         * @param {string} metricLabel - El nombre de la métrica (ej. "Conteo de Tickets").
         * @returns {HTMLElement} - El elemento contenedor listo para ser capturado.
         */
        renderReportForPDF(reportData, dimensionLabel, metricLabel) {
            const target = document.getElementById('pdf-render-target');
            const chartSVG = document.querySelector('#report-chart-container svg').cloneNode(true);

            // Ajustar tamaño del SVG para el PDF
            chartSVG.setAttribute('width', '700');
            chartSVG.setAttribute('height', '400');

            const now = new Date();
            const formattedDate = `${now.toLocaleDateString('es-AR')} ${now.toLocaleTimeString('es-AR')}`;

            let tableHtml = `
                <table class="table table-bordered table-striped mt-4">
                    <thead class="table-dark">
                        <tr>
                            <th>${dimensionLabel}</th>
                            <th>${metricLabel}</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            reportData.labels.forEach((label, index) => {
                tableHtml += `<tr><td>${label}</td><td>${reportData.data[index]}</td></tr>`;
            });
            tableHtml += `</tbody></table>`;

            target.innerHTML = `
                <div style="width: 210mm; padding: 20mm; box-sizing: border-box; color: #1f2937;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #6366f1; padding-bottom: 10px;">
                        <div style="font-size: 24px; font-weight: 800; color: #6366f1;">
                            <i class="fas fa-ticket-alt"></i> Sticket Pro
                        </div>
                        <div style="text-align: right;">
                            <h2 style="margin: 0; font-size: 28px; font-weight: 700;">Reporte Personalizado</h2>
                            <p style="margin: 0; color: #6b7280;">Generado: ${formattedDate}</p>
                        </div>
                    </div>
                    <div style="margin-top: 40px; text-align: center;">
                        ${chartSVG.outerHTML}
                    </div>
                    <div style="margin-top: 40px;">
                        <h4 style="margin-bottom: 15px; border-bottom: 1px solid #e5e7eb; padding-bottom: 5px;">Datos del Reporte</h4>
                        ${tableHtml}
                    </div>
                </div>
            `;
            return target.firstElementChild; // Devolver el contenedor A4
        },

        /**
         * 🆕 Renderiza el gráfico del reporte personalizado.
         * @param {object} reportData - Los datos procesados para el reporte.
         * @param {string} chartType - El tipo de gráfico a renderizar.
         */
        renderCustomReport(reportData, chartType) {
            const container = document.getElementById('report-chart-container');
            const downloadBtn = document.getElementById('download-pdf-btn');
            if (!container || !downloadBtn) return;

            container.innerHTML = ''; // Limpiar el contenedor

            if (!reportData || reportData.labels.length === 0) {
                container.innerHTML = `
                    <div class="report-placeholder">
                        <i class="fas fa-box-open"></i>
                        <p>No se encontraron datos</p>
                        <small>Intenta con un rango de fechas diferente o distintas métricas.</small>
                    </div>`;
                downloadBtn.style.display = 'none'; // Ocultar botón si no hay datos
                return;
            }

            const d3ChartData = {
                labels: reportData.labels,
                data: reportData.data,
                backgroundColor: reportData.labels.map((_, i) => `hsl(${i * 60}, 70%, 60%)`)
            };

            // El título se pondrá en el PDF, no es necesario aquí para tener más espacio
            this.renderD3Chart('report-chart-container', d3ChartData, chartType, '');

            downloadBtn.style.display = 'block'; // Mostrar botón de descarga
        },

        /**
         * 🆕 Inicializa el modal del constructor de reportes con campos y lógica de drag & drop.
         */
        renderReportGeneratorModal() {
            console.log('🏗️ Inicializando constructor de reportes...');
            const fieldsSource = document.getElementById('report-fields-source');
            const dimensionDrop = document.getElementById('report-dimension-drop');
            const metricDrop = document.getElementById('report-metric-drop');

            if (!fieldsSource || !dimensionDrop || !metricDrop) return;

            // Definir los campos disponibles para reportes
            const reportFields = [
                { id: 'Estado', label: 'Estado', type: 'dimension' },
                { id: 'Prioridad', label: 'Prioridad', type: 'dimension' },
                { id: 'Herramienta', label: 'Herramienta', type: 'dimension' },
                { id: 'Creado Por', label: 'Creado Por', type: 'dimension' },
                { id: 'Tomado Por', label: 'Tomado Por', type: 'dimension' },
                { id: 'Mal Derivado', label: 'Mal Derivado', type: 'dimension' },
                { id: 'Ticket Interno', label: 'Conteo de Tickets', type: 'metric' }
            ];

            fieldsSource.innerHTML = '';
            reportFields.forEach(field => {
                const fieldEl = document.createElement('div');
                fieldEl.className = 'report-field-item';
                fieldEl.draggable = true;
                fieldEl.dataset.fieldId = field.id;
                fieldEl.dataset.fieldType = field.type;
                fieldEl.innerHTML = `<i class="fas fa-grip-vertical"></i> ${field.label}`;
                fieldsSource.appendChild(fieldEl);
            });

            let draggedItem = null;

            fieldsSource.addEventListener('dragstart', (e) => {
                draggedItem = e.target;
                setTimeout(() => e.target.style.display = 'none', 0);
            });

            fieldsSource.addEventListener('dragend', (e) => {
                setTimeout(() => {
                    if (draggedItem) {
                        draggedItem.style.display = 'flex';
                        draggedItem = null;
                    }
                }, 0);
            });

            const dropZones = [dimensionDrop, metricDrop];
            dropZones.forEach(zone => {
                zone.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    zone.classList.add('drag-over');
                });

                zone.addEventListener('dragleave', () => {
                    zone.classList.remove('drag-over');
                });

                zone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    zone.classList.remove('drag-over');
                    if (draggedItem) {
                        // Solo permite un item por zona
                        zone.innerHTML = '';
                        const clonedItem = draggedItem.cloneNode(true);
                        clonedItem.draggable = false;
                        zone.appendChild(clonedItem);
                        draggedItem.style.display = 'flex';
                        draggedItem = null;
                    }
                });
            });
        },

        /**
         * 🆕 Renderiza el gráfico del reporte personalizado.
         * @param {object} reportData - Los datos procesados para el reporte.
         * @param {string} chartType - El tipo de gráfico a renderizar.
         */
        renderCustomReport(reportData, chartType) {
            const container = document.getElementById('report-chart-container');
            if (!container) return;

            container.innerHTML = ''; // Limpiar el contenedor

            if (!reportData || reportData.labels.length === 0) {
                container.innerHTML = `
                    <div class="report-placeholder">
                        <i class="fas fa-box-open"></i>
                        <p>No se encontraron datos</p>
                        <small>Intenta con un rango de fechas diferente o distintas métricas.</small>
                    </div>`;
                return;
            }

            const d3ChartData = {
                labels: reportData.labels,
                data: reportData.data,
                backgroundColor: reportData.labels.map((_, i) => `hsl(${i * 60}, 70%, 60%)`)
            };

            this.renderD3Chart('report-chart-container', d3ChartData, chartType, 'Reporte Personalizado');
        },

        // LOGICA DE foto de perfil
        /**
         * 🆕 Actualiza la imagen de perfil del usuario con manejo robusto de errores.
         * @param {string} photoUrl - URL de la foto de perfil.
         * @param {string} email - Email del usuario (para fallback).
         */
        updateProfileImage(photoUrl, email) {
            const dropdownButton = document.querySelector('#dropdownUser1');
            const profileIcon = document.querySelector('#dropdownUser1 i.fas.fa-user-circle');

            if (!dropdownButton || !profileIcon) {
                console.warn('No se encontraron los elementos del perfil');
                return;
            }

            console.log('🖼️ Cargando imagen de perfil:', photoUrl);

            if (photoUrl) {
                // Remover imagen anterior si existe
                const existingImg = dropdownButton.querySelector('.profile-image');
                if (existingImg) existingImg.remove();

                // Crear nueva imagen
                const img = document.createElement('img');
                img.src = photoUrl;
                img.className = 'profile-image rounded-circle me-2';
                img.style.width = '32px';
                img.style.height = '32px';
                img.style.objectFit = 'cover';
                img.style.display = 'none'; // Ocultar hasta que cargue
                img.alt = 'Foto de perfil';

                // Manejar carga exitosa
                img.onload = function () {
                    console.log('✅ Imagen de perfil cargada correctamente');
                    profileIcon.style.display = 'none';
                    this.style.display = 'inline';
                };

                // Manejar error de carga (aunque con Gravatar + fallback es muy raro)
                img.onerror = function () {
                    console.warn('❌ Error al cargar imagen, usando ícono por defecto');
                    this.remove();
                    profileIcon.style.display = 'inline';
                };

                // Timeout de seguridad
                setTimeout(() => {
                    if (img.style.display === 'none') {
                        console.warn('⏰ Timeout cargando imagen, usando ícono por defecto');
                        img.remove();
                        profileIcon.style.display = 'inline';
                    }
                }, 10000); // 10 segundos

                // Insertar imagen antes del ícono
                dropdownButton.insertBefore(img, profileIcon);
            } else {
                console.warn('No se proporcionó URL de imagen');
                profileIcon.style.display = 'inline';
            }
        },

        /**
         * 🆕 Muestra el nombre del superior del usuario en la barra superior.
         * @param {string} superiorName - El nombre del superior.
         */
        displayUserSuperior(superiorName) {
            const userSuperiorElement = document.getElementById('user-superior-display');
            if (userSuperiorElement) {
                userSuperiorElement.textContent = `Equipo: ${superiorName}`;
            }
        },
        // TERMINA LOGICA DE foto de perfil


        // LOGICA DE SUPERIOR
        /**
         * 🆕 Muestra el nombre del superior del usuario en la barra superior.
         * @param {string} superiorName - El nombre del superior.
         */
        displayUserSuperior(superiorName) {
            const userSuperiorElement = document.getElementById('user-superior-display');
            if (userSuperiorElement) {
                userSuperiorElement.textContent = `Equipo: ${superiorName}`;
            }
        },
        // TERMINA LOGICA DE SUPERIOR

        // EMPIEZA IAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        addChatMessage(sender, message) {
            const history = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('chat-message', sender);

            const p = document.createElement('p');
            p.textContent = message; // Usar textContent para prevenir inyección de HTML
            messageDiv.appendChild(p);

            history.appendChild(messageDiv);
            history.scrollTop = history.scrollHeight;
        },

        showBotTyping(isLoading) {
            let typingIndicator = document.getElementById('bot-typing-indicator');
            if (isLoading) {
                if (!typingIndicator) {
                    typingIndicator = document.createElement('div');
                    typingIndicator.id = 'bot-typing-indicator';
                    typingIndicator.classList.add('chat-message', 'bot', 'bot-typing');
                    typingIndicator.innerHTML = `<p>Sticket Pro Assistant está escribiendo...</p>`;
                    document.getElementById('chat-history').appendChild(typingIndicator);
                    document.getElementById('chat-history').scrollTop = document.getElementById('chat-history').scrollHeight;
                }
            } else {
                if (typingIndicator) {
                    typingIndicator.remove();
                }
            }
        },
        // TERMINA  IAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        /**
         * ✅ [MODIFICADO] Renderiza los contadores de tickets por motivo de escalamiento.
         * @param {object} motivoEscalamientoCounts - Objeto con el conteo de tickets por motivo.
         * @param {string} targetId - El ID del elemento contenedor donde se renderizará.
         */
        renderMotivoEscalamientoCounters(motivoEscalamientoCounts, targetId = 'motivo-escalamiento-counters') {
            const container = document.getElementById(targetId);
            if (!container) return;

            const sortedMotivos = Object.entries(motivoEscalamientoCounts)
                .sort(([, countA], [, countB]) => countB - countA) // Ordenar de mayor a menor
                .slice(0, 5); // Mostrar los top 5

            let html = `
        <div class="card h-100 shadow-sm">
          <div class="card-header">
            <h6><i class="fas fa-tags me-2"></i>Top 5 Motivos de Escalamiento</h6>
          </div>
          <div class="card-body">
            <ul class="list-group list-group-flush">
      `;

            if (sortedMotivos.length === 0) {
                html += `<li class="list-group-item text-muted fst-italic">No hay datos de motivos de escalamiento.</li>`;
            } else {
                sortedMotivos.forEach(([motivo, count]) => {
                    html += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
              ${motivo}
              <span class="badge bg-primary rounded-pill">${count}</span>
            </li>
          `;
                });
            }

            html += `
            </ul>
          </div>
        </div>
      `;
            container.innerHTML = html;
        },

        /**
         * @description Aplica permisos visuales basados en el rol del usuario.
         */
        applyPermissions() {
            const role = state.userProfile.role;
            if (role === 'SUPERUSER' || role === 'AUDITOR') {
                document.getElementById('nav-auditoria').style.display = 'block';
            } else {
                document.getElementById('nav-auditoria').style.display = 'none';
            }
            const exportButton = document.getElementById('export-to-excel-btn');
            if (exportButton) {
                if (role === 'SUPERUSER' || role === 'AUDITOR') {
                    exportButton.style.display = 'block';
                } else {
                    exportButton.style.display = 'none';
                }
            }
        },

        // 🆕 NUEVA FUNCIÓN:
        renderNotificationSummary() {
            const notificationContainer = document.getElementById('notification-summary');
            if (!notificationContainer) return;

            const totalUnread = state.notifications.length;
            const recentNotifications = state.notifications.slice(0, 3);

            let notificationsHtml = '';

            if (recentNotifications.length === 0) {
                notificationsHtml = `
                    <p class="text-muted fst-italic">No hay notificaciones recientes.</p>
                `;
            } else {
                notificationsHtml = `
                    <ul class="list-group list-group-flush">
                        ${recentNotifications.map(n => `
                            <li class="list-group-item d-flex justify-content-between align-items-start notification-item-dashboard"
                                data-notification-row="${n.row}" data-ticket-id="${n.ticketId || ''}" style="cursor: pointer;">
                                <div>
                                    <small class="fw-bold">${n.message}</small><br>
                                    <small class="text-muted">${new Date(n.timestamp).toLocaleString()}</small>
                                </div>
                            </li>
                        `).join('')}
                    </ul>
                `;
            }

            notificationContainer.innerHTML = `
                <div class="card h-100">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h6><i class="fas fa-bell me-2"></i>Notificaciones Recientes</h6>
                        <span class="badge bg-danger rounded-pill">${totalUnread}</span>
                    </div>
                    <div class="card-body">
                        ${notificationsHtml}
                    </div>
                </div>
            `;

            document.querySelectorAll('.notification-item-dashboard').forEach(item => {
                item.addEventListener('click', Handlers.handleNotificationClick);
            });
        },

        /**
         * ✅ [MODIFICADO] Renderiza el resumen de tickets urgentes en el dashboard.
         * @param {string} targetId - El ID del elemento contenedor donde se renderizará.
         */
        renderUrgentTicketsSummary(targetId = 'urgent-tickets-summary') {
            const urgentContainer = document.getElementById(targetId);
            if (!urgentContainer) return;

            const urgentTickets = state.allTicketsForStats.filter(t => t.prioridad === 'Urgente');
            const recentUrgentTickets = urgentTickets.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 3);

            if (recentUrgentTickets.length === 0) {
                urgentContainer.innerHTML = `
                    <div class="card h-100">
                        <div class="card-header">
                            <h6><i class="fas fa-exclamation-triangle me-2"></i>Tickets Urgentes</h6>
                        </div>
                        <div class="card-body d-flex align-items-center justify-content-center">
                            <p class="text-muted fst-italic">No hay tickets urgentes actualmente.</p>
                        </div>
                    </div>
                `;
                return;
            }

            urgentContainer.innerHTML = `
                <div class="card h-100">
                    <div class="card-header">
                        <h6><i class="fas fa-exclamation-triangle me-2"></i>Tickets Urgentes</h6>
                    </div>
                    <div class="card-body">
                        ${recentUrgentTickets.map(t => `
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <small><strong>${t.ticketInterno}:</strong> ${t.pedido}</small>
                                <small class="text-muted">${t.timestamp.toLocaleDateString()}</small>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        },


        /**
         * @description Renderiza el contenido completo de la vista del dashboard.
         * @param {Array<object>} tickets - El array de tickets del estado global.
         */
        renderDashboard(tickets) {
            const stats = state.allTicketsForStats.reduce((acc, t) => {
                if (['Registrado', 'En Progreso'].includes(t.estado)) acc.open++;
                if (t.estado === 'En Progreso') acc.pending++;
                if (t.estado === 'Resuelto') acc.resolved++;
                if (t.prioridad === 'Urgente') acc.urgent++;
                return acc;
            }, { open: 0, pending: 0, resolved: 0, urgent: 0 });

            this.renderStats(stats);
            this.renderRecentTickets(state.allTicketsForStats.slice(0, 5));

            const chartData = this.prepareDashboardCharts(state.allTicketsForStats);

            this.renderD3Chart('ticketsChart', chartData.activity, 'line', 'Actividad de Tickets');
            this.renderD3Chart('ticket-status-chart', chartData.ticketStatus, 'bar', 'Distribución de Tickets por Estado');

            // ✅ CAMBIO: Renderizar el gráfico de métricas en tiempo real como LÍNEA
            this.renderD3Chart('realtime-metrics-chart', chartData.realtimeMetrics, 'line', 'Tickets Creados (Últimas 24h)');

            this.renderNotificationSummary();
            this.renderUrgentTicketsSummary('urgent-tickets-summary');
            this.renderMotivoEscalamientoCounters(chartData.motivoEscalamientoCounts, 'motivo-escalamiento-counters');
        },

        /**
         * @description Prepara y estructura los datos de los tickets para ser consumidos por la librería de gráficos D3.js.
         * @param {Array<object>} tickets - El array de tickets.
         * @returns {object} Un objeto con datos listos para los gráficos de actividad y SLA.
         */
        prepareDashboardCharts(tickets) {
            const activityByDay = new Array(7).fill(0);
            const resolvedByDay = new Array(7).fill(0);
            tickets.forEach(t => {
                const dayOfWeek = t.timestamp.getDay();
                const adjustedDay = (dayOfWeek === 0) ? 6 : dayOfWeek - 1; // Lunes=0, Domingo=6
                activityByDay[adjustedDay]++;
                if (t.estado === 'Resuelto') {
                    resolvedByDay[adjustedDay]++;
                }
            });

            // Datos para el gráfico de estado (para barras)
            const statusCounts = tickets.reduce((acc, t) => {
                const status = t.estado || 'Registrado';
                acc[status] = (acc[status] || 0) + 1;
                return acc;
            }, { 'Registrado': 0, 'En Progreso': 0, 'Resuelto': 0, 'Cerrado': 0 });

            const statusLabels = Object.keys(statusCounts);
            const statusData = Object.values(statusCounts);
            const statusColors = statusLabels.map(status => {
                switch (status) {
                    case 'Registrado': return '#4a90e2';
                    case 'En Progreso': return '#f5a623';
                    case 'Resuelto': return '#50e3c2';
                    case 'Cerrado': return '#9b9b9b';
                    default: return '#cccccc';
                }
            });

            // Datos para el gráfico de tickets por herramienta (para barras)
            const toolCounts = tickets.reduce((acc, t) => {
                const tool = t.herramienta || 'Desconocida';
                acc[tool] = (acc[tool] || 0) + 1;
                return acc;
            }, {});
            const toolLabels = Object.keys(toolCounts);
            const toolData = Object.values(toolCounts);
            const toolColors = toolLabels.map((_, i) => `hsl(${i * 60}, 70%, 60%)`); // Colores dinámicos

            // 🆕 Datos para el gráfico de métricas en tiempo real (ejemplo: tickets creados por hora en las últimas 24h)
            const now = new Date();
            const oneDayAgo = new Date(now.getTime() - 24 * 60 * 60 * 1000);
            const hourlyCounts = new Array(24).fill(0);
            const hourlyLabels = Array.from({ length: 24 }, (_, i) => {
                const hour = (now.getHours() - 23 + i + 24) % 24; // Últimas 24 horas
                return `${hour.toString().padStart(2, '0')}:00`;
            });

            tickets.forEach(t => {
                if (t.timestamp) {
                    const timestamp = new Date(t.timestamp);
                    if (timestamp >= oneDayAgo && timestamp <= now) {
                        const hourDiff = Math.floor((now.getTime() - timestamp.getTime()) / (60 * 60 * 1000));
                        if (hourDiff >= 0 && hourDiff < 24) {
                            hourlyCounts[23 - hourDiff]++; // Contar en la hora correcta
                        }
                    }
                }
            });

            // 🆕 Datos para el contador de motivos de escalamiento
            const motivoEscalamientoCounts = tickets.reduce((acc, t) => {
                const motivo = t.pedido || 'Desconocido';
                acc[motivo] = (acc[motivo] || 0) + 1;
                return acc;
            }, {});


            return {
                activity: {
                    labels: ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'],
                    datasets: [{
                        label: 'Nuevos',
                        data: activityByDay,
                        borderColor: 'var(--secondary-color)',
                        tension: 0.4,
                        fill: false,
                    }, {
                        label: 'Resueltos',
                        data: resolvedByDay,
                        borderColor: 'var(--success-color)',
                        tension: 0.4,
                        fill: false,
                    }]
                },
                ticketStatus: { // Para gráfico de barras
                    labels: statusLabels,
                    data: statusData,
                    backgroundColor: statusColors
                },
                ticketsByTool: { // Para gráfico de barras
                    labels: toolLabels,
                    data: toolData,
                    backgroundColor: toolColors
                },
                // ✅ CAMBIO: Formato de datos para gráfico de LÍNEA
                realtimeMetrics: {
                    labels: hourlyLabels,
                    datasets: [{
                        label: 'Creados',
                        data: hourlyCounts,
                        borderColor: 'var(--info-color)',
                        tension: 0.4,
                        fill: false,
                    }]
                },
                motivoEscalamientoCounts: motivoEscalamientoCounts // Datos para contadores
            };
        },

        /**
         * @description Renderiza la tabla completa de tickets en la vista 'Tickets'.
         * @param {Array<object>} tickets - El array de tickets a mostrar.
         */
        renderTicketsPage(tickets) {
            const tbody = document.getElementById('all-tickets-table-body');
            if (!tbody) return;

            // Llenar filtros de motivo de escalamiento y creadores
            const motivoEscalamientoFilter = document.getElementById('tickets-filter-motivoEscalamiento'); // 🆕 RENOMBRADO
            const createdByFilter = document.getElementById('tickets-filter-createdBy');
            const equipoFilter = document.getElementById('tickets-filter-equipo'); // 🆕 NUEVO
            const priorityFilter = document.getElementById('tickets-filter-priority');

            if (motivoEscalamientoFilter && createdByFilter && priorityFilter) {
                const allMotivosEscalamiento = [...new Set(state.allTicketsForStats.map(t => t.pedido).filter(p => p && p.trim() !== ''))].sort();
                UI.populateSelect(motivoEscalamientoFilter, allMotivosEscalamiento, 'Filtrar por Motivo Escalamiento'); // 🆕 RENOMBRADO

                UI.populateSelect(createdByFilter, state.allCreators, 'Filtrar por Creador');
                UI.populateSelect(equipoFilter, state.allSuperiores, 'Filtrar por Equipo'); // 🆕 NUEVO

                // Restaurar valores de filtro
                motivoEscalamientoFilter.value = state.filters.motivoEscalamiento; // 🆕 RENOMBRADO
                createdByFilter.value = state.filters.createdBy;
                equipoFilter.value = state.filters.equipo; // 🆕 NUEVO
                document.getElementById('tickets-filter-status').value = state.filters.status;

         * @param {string} defaultOptionText - Texto para la opción por defecto.

        populateSelect(selectElement, optionsArray, defaultOptionText) {

            const paginationContainer = document.getElementById('tickets-pagination');
            if (!paginationContainer) return;

            const { currentPage, totalPages } = state.pagination;
            let paginationHtml = `
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="prev">Anterior</a>
                </li>
            `;

            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, currentPage + 2);

            if (startPage === 1 && endPage < totalPages) {
                endPage = Math.min(totalPages, endPage + (3 - (currentPage - startPage)));
            }
            if (endPage === totalPages && startPage > 1) {
                startPage = Math.max(1, startPage - (3 - (endPage - currentPage)));
            }

            for (let i = startPage; i <= endPage; i++) {
                paginationHtml += `
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>
                `;
            }

            paginationHtml += `
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="next">Siguiente</a>
                </li>
            `;
            paginationContainer.innerHTML = paginationHtml;
        },

        /**
         * @description Calcula las métricas de creación y resolución de tickets por usuario.
         * @returns {object} Un objeto donde cada clave es un usuario y el valor son sus métricas.
         */
        calculateUserMetrics(tickets) {
            console.log('🔍 Calculando métricas para', tickets.length, 'tickets');
            const metrics = {};

            tickets.forEach(ticket => {
                const user = ticket.creadoPor || ticket['Creado Por'];
                if (!user) return;

                if (!metrics[user]) {
                    metrics[user] = {
                        total: 0,
                        resueltos: 0,
                        totalTiempoResolucion: 0,
                        ticketsConTTR: 0,
                        resueltosEn72hs: 0,
                        malDerivados: 0,
                        primerContacto: 0,
                        seguimientoEspecial: 0
                    };
                }

                metrics[user].total++;

                // Métricas de auditoría
                if (ticket.malDerivado === true) metrics[user].malDerivados++;
                if (ticket.resolucionPrimerContacto === true) metrics[user].primerContacto++;
                if (ticket.seguimientoEspecial === true) metrics[user].seguimientoEspecial++;

                // Solo calcular TTR si el ticket está resuelto Y tiene fecha de resolución real
                if (ticket.estado === 'Resuelto') {
                    metrics[user].resueltos++;

                    // Verificar si tiene fecha de resolución real válida
                    let fechaResolucionReal = null;
                    let fechaCreacion = null;

                    // Parsear fecha de resolución real
                    if (ticket.fechaResolucionReal) {
                        if (ticket.fechaResolucionReal instanceof Date) {
                            fechaResolucionReal = ticket.fechaResolucionReal;
                        } else if (typeof ticket.fechaResolucionReal === 'string') {
                            fechaResolucionReal = new Date(ticket.fechaResolucionReal);
                        }
                    }

                    // Parsear fecha de creación
                    if (ticket.timestamp) {
                        if (ticket.timestamp instanceof Date) {
                            fechaCreacion = ticket.timestamp;
                        } else if (typeof ticket.timestamp === 'string') {
                            fechaCreacion = new Date(ticket.timestamp);
                        }
                    }

                    // Solo calcular si ambas fechas son válidas
                    if (fechaResolucionReal && !isNaN(fechaResolucionReal.getTime()) &&
                        fechaCreacion && !isNaN(fechaCreacion.getTime())) {

                        const tiempoResolucion = fechaResolucionReal.getTime() - fechaCreacion.getTime();

                        if (tiempoResolucion >= 0) {
                            metrics[user].totalTiempoResolucion += tiempoResolucion;
                            metrics[user].ticketsConTTR++;

                            // 72 horas = 259,200,000 milisegundos
                            if (tiempoResolucion <= 259200000) {
                                metrics[user].resueltosEn72hs++;
                            }

                            console.log(`✅ TTR calculado para ${user}: ${tiempoResolucion}ms`);
                        }
                    }
                }
            });

            console.log('📊 Métricas calculadas:', metrics);
            return metrics;
        },



        /**
         * 🆕 Función de utilidad para formatear milisegundos a un formato legible.
         * @param {number} ms - Milisegundos a formatear.
         * @returns {string} Tiempo formateado como "Xd Yh Zm".
         */
        formatMilliseconds(ms) {
            console.log('🔍 Formateando milisegundos:', ms, typeof ms);

            if (typeof ms !== 'number' || isNaN(ms) || ms < 0) {
                console.warn('⚠️ Milisegundos inválidos:', ms);
                return 'N/A';
            }

            const days = Math.floor(ms / 86400000);
            const hours = Math.floor((ms % 86400000) / 3600000);
            const minutes = Math.floor((ms % 3600000) / 60000);

            console.log('✅ Tiempo calculado:', { days, hours, minutes });
            return `${days}d ${hours}h ${minutes}m`;
        },




        /**
         * @description Renderiza la tabla de métricas por usuario.
         * @param {boolean} isModal - Indica si se renderiza en el modal o en la vista principal.
         */
        renderUserMetrics(isModal = false) {
            const tickets = state.allTicketsForStats || [];
            const metrics = this.calculateUserMetrics(tickets);
            const tableId = isModal ? 'user-metrics-modal-table-body' : 'user-metrics-table-body';
            const tbody = document.getElementById(tableId);

            if (!tbody) return;

            if (Object.keys(metrics).length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted fst-italic">No hay datos de métricas de usuario.</td></tr>`;
            } else {
                tbody.innerHTML = Object.entries(metrics).map(([user, userMetrics]) => {
                    // ✅ CORRECCIÓN: Calcular métricas correctamente
                    const avgTTR = userMetrics.ticketsConTTR > 0
                        ? this.formatMilliseconds(userMetrics.totalTiempoResolucion / userMetrics.ticketsConTTR)
                        : 'N/A';

                    const resolucionEn72hs = userMetrics.resueltos > 0
                        ? `${userMetrics.resueltosEn72hs}/${userMetrics.resueltos} (${((userMetrics.resueltosEn72hs / userMetrics.resueltos) * 100).toFixed(1)}%)`
                        : 'N/A';

                    const tasaError = userMetrics.total > 0
                        ? `${((userMetrics.malDerivados / userMetrics.total) * 100).toFixed(1)}%`
                        : '0%';

                    const tasaPrimerContacto = userMetrics.resueltos > 0
                        ? `${userMetrics.primerContacto}/${userMetrics.resueltos} (${((userMetrics.primerContacto / userMetrics.resueltos) * 100).toFixed(1)}%)`
                        : 'N/A';

                    return `
                        <tr>
                            <td class="fw-bold">${user}</td>
                            <td>${userMetrics.total}</td>
                            <td class="text-success">${userMetrics.resueltos}</td>
                            <td>${avgTTR}</td>
                            <td>${resolucionEn72hs}</td>
                            <td class="text-danger">${tasaError} (${userMetrics.malDerivados})</td>
                            <td>${tasaPrimerContacto}</td>
                            <td>${userMetrics.seguimientoEspecial}</td>
                        </tr>
                    `;
                }).join('');
            }
        },

        /**
         * @description Renderiza la tabla de métricas por usuario en su modal correspondiente.
         */
        renderUserMetricsModal() {
            UI.renderUserMetrics(true); // Llama a la función centralizada con el flag de modal
        },


        /**
         * @description Renderiza un gráfico D3.js en un contenedor específico.
         * @param {string} containerId - El ID del elemento div que contendrá el gráfico.
         * @param {object} chartData - Los datos formateados para el gráfico.
         * @param {string} type - El tipo de gráfico ('line', 'donut', 'bar').
         * @param {string} title - El título del gráfico.
         */
        renderD3Chart(containerId, chartData, type, title) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            const width = container.clientWidth;
            const height = container.clientHeight > 0 ? container.clientHeight : 250;

            const svg = d3.select(`#${containerId}`)
                .append("svg")
                .attr("width", width)
                .attr("height", height);

            // Añadir título al gráfico
            svg.append("text")
                .attr("x", width / 2)
                .attr("y", 20) // Ajustar posición del título
                .attr("text-anchor", "middle")
                .style("font-size", "1.3rem")
                .style("font-weight", "700")
                .style("fill", "var(--text-color)")
                .text(title);

            if (type === 'line') {
                const margin = { top: 40, right: 30, bottom: 40, left: 50 }; // Ajustar margen superior por el título
                const innerWidth = width - margin.left - margin.right;
                const innerHeight = height - margin.top - margin.bottom;

                const g = svg.append("g")
                    .attr("transform", `translate(${margin.left},${margin.top})`);

                const x = d3.scaleBand()
                    .domain(chartData.labels)
                    .range([0, innerWidth])
                    .padding(0.1);

                const y = d3.scaleLinear()
                    .domain([0, d3.max(chartData.datasets, d => d3.max(d.data)) * 1.2])
                    .range([innerHeight, 0]);

                g.append("g")
                    .attr("transform", `translate(0,${innerHeight})`)
                    .call(d3.axisBottom(x))
                    .selectAll("text")
                    .style("text-anchor", "end")
                    .attr("dx", "-.8em")
                    .attr("dy", ".15em")
                    .attr("transform", "rotate(-45)")
                    .style("fill", "var(--text-color)");

                g.append("g")
                    .call(d3.axisLeft(y))
                    .selectAll("text")
                    .style("fill", "var(--text-color)");

                chartData.datasets.forEach(dataset => {
                    const line = d3.line()
                        .x((d, i) => x(chartData.labels[i]) + x.bandwidth() / 2)
                        .y(d => y(d))
                        .curve(d3.curveMonotoneX);

                    g.append("path")
                        .datum(dataset.data)
                        .attr("fill", "none")
                        .attr("stroke", dataset.borderColor)
                        .attr("stroke-width", 2)
                        .attr("d", line);

                    g.selectAll(`.dot-${dataset.label.replace(/\s/g, '')}`)
                        .data(dataset.data)
                        .enter().append("circle")
                        .attr("class", `dot-${dataset.label.replace(/\s/g, '')}`)
                        .attr("cx", (d, i) => x(chartData.labels[i]) + x.bandwidth() / 2)
                        .attr("cy", d => y(d))
                        .attr("r", 4)
                        .attr("fill", dataset.borderColor)
                        .on("mouseover", function (event, d) {
                            d3.select(this).attr("r", 6);
                            const tooltip = d3.select("body").append("div")
                                .attr("class", "tooltip")
                                .style("opacity", 0);
                            tooltip.transition().duration(200).style("opacity", .9);
                            tooltip.html(`Valor: ${d}`)
                                .style("left", (event.pageX + 10) + "px")
                                .style("top", (event.pageY - 28) + "px");
                        })
                        .on("mouseout", function (d) {
                            d3.select(this).attr("r", 4);
                            d3.select(".tooltip").remove();
                        });
                });

                const legend = g.append("g")
                    .attr("font-family", "sans-serif")
                    .attr("font-size", 10)
                    .attr("text-anchor", "end")
                    .selectAll("g")
                    .data(chartData.datasets)
                    .enter().append("g")
                    .attr("transform", (d, i) => `translate(0,${i * 20})`);

                legend.append("rect")
                    .attr("x", innerWidth - 19)
                    .attr("width", 19)
                    .attr("height", 19)
                    .attr("fill", d => d.borderColor);

                legend.append("text")
                    .attr("x", innerWidth - 24)
                    .attr("y", 9.5)
                    .attr("dy", "0.32em")
                    .text(d => d.label)
                    .style("fill", "var(--text-color)");

            } else if (type === 'donut') {
                const radius = Math.min(width, height) / 2 - 20;

                const g = svg.append("g")
                    .attr("transform", `translate(${width / 2},${height / 2 + 20})`); // Ajustar posición por el título

                const pie = d3.pie()
                    .value(d => d);

                const arc = d3.arc()
                    .innerRadius(radius * 0.6)
                    .outerRadius(radius);

                const arcs = g.selectAll("arc")
                    .data(pie(chartData.datasets[0].data))
                    .enter()
                    .append("g")
                    .attr("class", "arc");

                arcs.append("path")
                    .attr("d", arc)
                    .attr("fill", (d, i) => chartData.datasets[0].backgroundColor[i])
                    .attr("stroke", state.isDarkMode() ? '#1e293b' : 'white')
                    .style("stroke-width", "2px")
                    .on("mouseover", function (event, d) {
                        d3.select(this).transition().duration(200)
                            .attr("d", d3.arc().innerRadius(radius * 0.6).outerRadius(radius * 1.05));
                        const tooltip = d3.select("body").append("div")
                            .attr("class", "tooltip").style("opacity", 0);
                        tooltip.transition().duration(200).style("opacity", .9);
                        tooltip.html(`${chartData.labels[d.index]}: ${d.data}`) // Mostrar valor absoluto
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function (d) {
                        d3.select(this).transition().duration(200)
                            .attr("d", arc);
                        d3.select(".tooltip").remove();
                    });

                arcs.append("text")
                    .attr("transform", d => `translate(${arc.centroid(d)})`)
                    .attr("dy", "0.35em")
                    .text(d => `${chartData.labels[d.index]} (${d.data})`) // Mostrar valor absoluto
                    .style("font-size", "12px")
                    .style("text-anchor", "middle")
                    .style("fill", state.isDarkMode() ? 'white' : 'black');
            } else if (type === 'bar') { // 🆕 Lógica para gráfico de barras
                const margin = { top: 40, right: 30, bottom: 60, left: 60 }; // Más margen inferior para etiquetas largas
                const innerWidth = width - margin.left - margin.right;
                const innerHeight = height - margin.top - margin.bottom;

                const g = svg.append("g")
                    .attr("transform", `translate(${margin.left},${margin.top})`);

                const x = d3.scaleBand()
                    .domain(chartData.labels)
                    .range([0, innerWidth])
                    .padding(0.2);

                const y = d3.scaleLinear()
                    .domain([0, d3.max(chartData.data) * 1.2])
                    .range([innerHeight, 0]);

                // Eje X
                g.append("g")
                    .attr("transform", `translate(0,${innerHeight})`)
                    .call(d3.axisBottom(x))
                    .selectAll("text")
                    .style("text-anchor", "end")
                    .attr("dx", "-.8em")
                    .attr("dy", ".15em")
                    .attr("transform", "rotate(-45)")
                    .style("fill", "var(--text-color)");

                // Eje Y
                g.append("g")
                    .call(d3.axisLeft(y).ticks(5))
                    .selectAll("text")
                    .style("fill", "var(--text-color)");

                // Barras
                g.selectAll(".bar")
                    .data(chartData.data)
                    .enter().append("rect")
                    .attr("class", "bar")
                    .attr("x", (d, i) => x(chartData.labels[i]))
                    .attr("y", d => y(d))
                    .attr("width", x.bandwidth())
                    .attr("height", d => innerHeight - y(d))
                    .attr("fill", (d, i) => Array.isArray(chartData.backgroundColor) ? chartData.backgroundColor[i] : chartData.backgroundColor)
                    .on("mouseover", function (event, d) {
                        d3.select(this).attr("opacity", 0.8);
                        const tooltip = d3.select("body").append("div")
                            .attr("class", "tooltip")
                            .style("opacity", 0);
                        tooltip.transition().duration(200).style("opacity", .9);
                        tooltip.html(`Valor: ${d}`)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function (d) {
                        d3.select(this).attr("opacity", 1);
                        d3.select(".tooltip").remove();
                    });

                // Etiquetas de valor en las barras (opcional, si hay espacio)
                g.selectAll(".bar-label")
                    .data(chartData.data)
                    .enter().append("text")
                    .attr("class", "bar-label")
                    .attr("x", (d, i) => x(chartData.labels[i]) + x.bandwidth() / 2)
                    .attr("y", d => y(d) - 5) // Un poco por encima de la barra
                    .attr("text-anchor", "middle")
                    .style("fill", "var(--text-color)")
                    .style("font-size", "10px")
                    .text(d => d);
            }
        },

        /**
         * @description Muestra una alerta dinámica de Bootstrap en un contenedor específico.
         * @param {string} elementId - ID del elemento donde se insertará la alerta.
         * @param {string} message - El mensaje a mostrar.
         * @param {string} type - El tipo de alerta de Bootstrap (ej. 'success', 'danger').
         */
        showAlert(elementId, message, type) {
            const placeholder = document.getElementById(elementId);
            if (placeholder) {
                placeholder.innerHTML = '';
                const wrapper = document.createElement('div');
                wrapper.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
                placeholder.append(wrapper);
            }
        },

        /**
         * @description Alterna el estado de un botón entre activo y de carga (con spinner).
         * @param {HTMLElement} button - El elemento del botón.
         * @param {boolean} show - True para mostrar el spinner, false para mostrar el texto.
         */
        toggleButtonSpinner(button, show) {
            if (!button) return;
            button.disabled = show;
            button.querySelector('.spinner-border')?.classList.toggle('d-none', !show);
            const text = button.querySelector('.button-text');
            if (text) text.style.display = show ? 'none' : 'inline';
        },

        /**
         * @description Cambia entre modo claro y oscuro.
         */
        toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));

            if (state.currentView === 'dashboard') {
                const chartData = UI.prepareDashboardCharts(state.allTicketsForStats);
                UI.renderD3Chart('ticketsChart', chartData.activity, 'line', 'Actividad de Tickets');
                UI.renderD3Chart('ticket-status-chart', chartData.ticketStatus, 'bar', 'Distribución de Tickets por Estado');
                UI.renderD3Chart('realtime-metrics-chart', chartData.realtimeMetrics, 'line', 'Tickets Creados (Últimas 24h)');
            } else if (state.currentView === 'reports') {
                const chartData = UI.prepareDashboardCharts(state.allTicketsForStats);
                UI.renderD3Chart('reportsChart1', chartData.activity, 'line', 'Tendencia de Tickets');
                UI.renderD3Chart('reportsChart3', chartData.ticketsByTool, 'bar', 'Tickets por Herramienta');
            }
            const modalAuditoria = document.getElementById('modalMetricasUsuario');
            if (modalAuditoria && modalAuditoria.classList.contains('show')) {
                UI.renderUserMetricsModal();
            }
        },

        /**
        * 🆕 Actualiza el estado visual del switch "Mis Tickets" y guarda en localStorage.
        * @param {boolean} isActive - True si el filtro está activo, false en caso contrario.
        */
        updateMyTicketsSwitch(isActive) {
            const myTicketsSwitch = document.getElementById('myTicketsSwitch');
            if (myTicketsSwitch) {
                myTicketsSwitch.checked = isActive;
                localStorage.setItem('myTicketsFilter', isActive);
            }
        },

        /**
         * 🔧 FUNCIÓN CORREGIDA: Manejador de errores que usa el sistema de loading
         * @param {Error} error - El objeto de error.
         */
        handleError(error) {
            console.error('❌ Error del servidor o de la aplicación:', error);
            LoadingManager.hide();
            UI.showAlert('global-alert-placeholder', `Error: ${error.message || 'Ocurrió un error desconocido.'}`, 'danger');
        },

        /**
         * @description Función de utilidad para obtener la clase CSS de Bootstrap correspondiente a un estado de ticket.
         * @param {string} status - El estado del ticket.
         * @returns {string} La clase CSS de la insignia (badge).
         */
        getBadgeClassForStatus(status) {
            switch (status) {
                case 'Registrado': return 'bg-primary';
                case 'En Progreso': return 'bg-warning text-dark';
                case 'Resuelto': return 'bg-success';
                case 'Cerrado': return 'bg-secondary';
                default: return 'bg-info text-dark';
            }
        },

        /**
         * @description Muestra u oculta la barra lateral (sidebar).
         * @param {boolean|null} forceState - True para forzar que se muestre, false para forzar que se oculte, null para alternar.
         */
        toggleSidebar(forceState = null) {
            const sidebar = document.querySelector('.sidebar');
            const mainContent = document.querySelector('.main-content');
            if (forceState === true) {
                sidebar.classList.remove('hidden-sidebar');
                mainContent.classList.remove('full-width-content');
            } else if (forceState === false) {
                sidebar.classList.add('hidden-sidebar');
                mainContent.classList.add('full-width-content');
            } else {
                sidebar.classList.toggle('hidden-sidebar');
                mainContent.classList.toggle('full-width-content');
            }
        },
    };
</script>
